name: synctasks
description: "SyncTasks Android task planning and focus app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0
  drift: ^2.22.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.0
  go_router: ^14.6.0
  shared_preferences: ^2.3.3
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  firebase_core: ^4.14.0
  firebase_crashlytics: ^5.3.0
  firebase_analytics: ^12.5.0
  intl: ^0.20.2
  hugeicons: ^1.1.7
  home_widget: ^0.9.3
  url_launcher: ^6.3.2
  audioplayers: ^6.8.1
  # Google Play Billing product queries, purchase stream, and non-consumable checkout are not provided by Flutter SDK.
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^3.0.0
  riverpod_lint: ^3.0.0
  drift_dev: ^2.22.0
  mocktail: ^1.0.4
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/logo-whitebackground.png
    - assets/images/notion-icon.webp
    - assets/sounds/
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

